services:
  tradingagents-api:
    build: .
    command: python -m tradingagents.api.server
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_API_HOST=0.0.0.0
      - TRADINGAGENTS_API_PORT=8422
      - TRADINGAGENTS_LLM_PROVIDER=${TRADINGAGENTS_LLM_PROVIDER:-openai}
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - NO_PROXY=localhost,127.0.0.1,::1,0.0.0.0,*.local,ollama
      - no_proxy=localhost,127.0.0.1,::1,0.0.0.0,*.local,ollama
    ports:
      - "8422:8422"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
