[package]
name = "tradingagents-desktop"
version = "1.0.0"
description = "TradingAgents desktop shell"
authors = ["TradingAgents"]
edition = "2021"
rust-version = "1.77.2"

# The binary that Tauri launches. `main.rs` owns the window + the bundled
# Python backend sidecar lifecycle.
[[bin]]
name = "tradingagents-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# Smaller, faster release bundles for distribution.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
